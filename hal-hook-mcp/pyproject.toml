[project]
name = "hal-hook-mcp"
version = "0.1.0"
description = "MCP server exposing hal-inject daemon control + target-app camera probing to Claude and AndroidHarness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pillow>=10.0.0",   # BLOB thumbnail + dim probing
    "starlette>=0.37",  # HTTP/SSE server (used by --http mode)
    "uvicorn>=0.30",    # ASGI runner for HTTP mode
]

[project.scripts]
hal-hook-mcp = "hal_hook_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
